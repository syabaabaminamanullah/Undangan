<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Wax Color Gradients -->
    <radialGradient id="waxGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8E2A2A" />
      <stop offset="30%" stop-color="#6F1A1A" />
      <stop offset="70%" stop-color="#4B0F0F" />
      <stop offset="100%" stop-color="#2B0505" />
    </radialGradient>
    
    <radialGradient id="goldRim" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8F6B1E" />
      <stop offset="100%" stop-color="#4E3506" />
    </radialGradient>

    <!-- Drop Shadow Filter for realistic 3D depth -->
    <filter id="sealShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Bevel / Emboss Filter -->
    <filter id="emboss">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Organic Irregular Wax Melting Edge -->
    <path d="M 100 12 
             C 125 10, 148 18, 165 35 
             C 182 52, 192 75, 188 100 
             C 185 125, 178 152, 158 170 
             C 138 188, 115 192, 95 188 
             C 70 185, 45 182, 30 162 
             C 12 142, 8 115, 12 92 
             C 16 68, 25 42, 45 28 
             C 65 14, 82 13, 100 12 Z" 
          fill="url(#waxGrad)" />

    <!-- Wax Inner Rim Ridge (Embossed look) -->
    <circle cx="100" cy="100" r="68" fill="none" stroke="#3A0808" stroke-width="4" opacity="0.6" />
    <circle cx="100" cy="100" r="66" fill="none" stroke="#A83232" stroke-width="2" opacity="0.4" />
    <circle cx="100" cy="100" r="62" fill="#581313" />

    <!-- Inner Decorative Dotted Ring -->
    <circle cx="100" cy="100" r="54" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.85" />
    <circle cx="100" cy="100" r="48" fill="none" stroke="url(#goldRim)" stroke-width="0.75" opacity="0.6" />

    <!-- Botanical Wreath on Seal -->
    <g stroke="url(#goldRim)" stroke-width="1" fill="none" opacity="0.85">
      <path d="M 68 115 C 60 95, 65 75, 80 62 C 86 58, 93 55, 100 55" />
      <path d="M 132 115 C 140 95, 135 75, 120 62 C 114 58, 107 55, 100 55" />
      <!-- tiny leaves -->
      <path d="M 66 100 Q 58 98 62 92 Q 68 95 66 100" fill="#D4AF37" />
      <path d="M 68 85 Q 60 80 66 74 Q 72 78 68 85" fill="#D4AF37" />
      <path d="M 78 70 Q 72 63 80 60 Q 84 66 78 70" fill="#D4AF37" />
      
      <path d="M 134 100 Q 142 98 138 92 Q 132 95 134 100" fill="#D4AF37" />
      <path d="M 132 85 Q 140 80 134 74 Q 128 78 132 85" fill="#D4AF37" />
      <path d="M 122 70 Q 128 63 120 60 Q 116 66 122 70" fill="#D4AF37" />
    </g>

    <!-- Monogram Embossed Text -->
    <text x="100" y="106" 
          font-family="'Cormorant Garamond', serif" 
          font-size="28" 
          font-weight="bold" 
          font-style="italic" 
          fill="url(#goldRim)" 
          text-anchor="middle" 
          letter-spacing="2"
          filter="url(#emboss)">
      A &amp; I
    </text>

    <!-- Tiny Star at bottom -->
    <text x="100" y="128" font-size="9" fill="url(#goldRim)" text-anchor="middle" opacity="0.8">✦ 14.12.26 ✦</text>

    <!-- Realistic Highlight Reflection -->
    <path d="M 45 45 C 65 25, 95 20, 125 25 C 105 28, 75 35, 55 52 C 48 58, 42 68, 38 78 C 36 65, 38 52, 45 45 Z" 
          fill="#FFFFFF" opacity="0.25" />
  </g>
</svg>
