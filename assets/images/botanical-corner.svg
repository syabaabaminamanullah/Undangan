<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F6B1E" />
    </linearGradient>
  </defs>

  <!-- Corner Border Lines -->
  <path d="M 10 70 L 10 10 L 70 10" stroke="url(#cornerGold)" stroke-width="1.2" opacity="0.6" />
  <circle cx="10" cy="10" r="2.5" fill="#D4AF37" />

  <!-- Botanical Branch flowing outward -->
  <path d="M 15 15 C 35 30, 60 40, 95 38" stroke="#4A5D4E" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
  <path d="M 15 15 C 30 35, 40 60, 38 95" stroke="#4A5D4E" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <!-- Eucalyptus leaves -->
  <path d="M 35 24 Q 45 15 50 25 Q 40 32 35 24" fill="#6B856D" opacity="0.7" />
  <path d="M 60 32 Q 72 22 78 34 Q 68 40 60 32" fill="#4E6750" opacity="0.7" />
  <path d="M 24 35 Q 15 45 25 50 Q 32 40 24 35" fill="#6B856D" opacity="0.7" />
  <path d="M 32 60 Q 22 72 34 78 Q 40 68 32 60" fill="#4E6750" opacity="0.7" />

  <!-- Tiny Gold Berries -->
  <circle cx="48" cy="48" r="2" fill="url(#cornerGold)" />
  <circle cx="75" cy="20" r="1.5" fill="url(#cornerGold)" />
  <circle cx="20" cy="75" r="1.5" fill="url(#cornerGold)" />
</svg>
