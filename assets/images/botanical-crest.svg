<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#855B14" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CA68C" />
      <stop offset="100%" stop-color="#3A533E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Wreath Ring -->
  <circle cx="200" cy="200" r="150" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="142" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.8"/>

  <!-- Left Olive & Eucalyptus Branch -->
  <g stroke="url(#sageGrad)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M 90 270 C 60 210, 70 140, 130 80 C 150 60, 180 50, 200 45" />
    <!-- Leaves left -->
    <path d="M 95 240 Q 60 240 75 220 Q 90 220 95 240" fill="#6B856D" opacity="0.85"/>
    <path d="M 80 200 Q 45 190 65 170 Q 80 180 80 200" fill="#4E6750" opacity="0.85"/>
    <path d="M 80 160 Q 55 140 80 125 Q 95 145 80 160" fill="#6B856D" opacity="0.85"/>
    <path d="M 100 120 Q 80 90 110 85 Q 120 105 100 120" fill="#4E6750" opacity="0.85"/>
    <path d="M 135 85 Q 120 55 150 55 Q 155 75 135 85" fill="#6B856D" opacity="0.85"/>
    <path d="M 175 60 Q 170 30 195 40 Q 190 58 175 60" fill="#4E6750" opacity="0.85"/>
  </g>

  <!-- Right Olive & Eucalyptus Branch (Mirrored) -->
  <g stroke="url(#sageGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" transform="translate(400, 0) scale(-1, 1)">
    <path d="M 90 270 C 60 210, 70 140, 130 80 C 150 60, 180 50, 200 45" />
    <!-- Leaves right -->
    <path d="M 95 240 Q 60 240 75 220 Q 90 220 95 240" fill="#6B856D" opacity="0.85"/>
    <path d="M 80 200 Q 45 190 65 170 Q 80 180 80 200" fill="#4E6750" opacity="0.85"/>
    <path d="M 80 160 Q 55 140 80 125 Q 95 145 80 160" fill="#6B856D" opacity="0.85"/>
    <path d="M 100 120 Q 80 90 110 85 Q 120 105 100 120" fill="#4E6750" opacity="0.85"/>
    <path d="M 135 85 Q 120 55 150 55 Q 155 75 135 85" fill="#6B856D" opacity="0.85"/>
    <path d="M 175 60 Q 170 30 195 40 Q 190 58 175 60" fill="#4E6750" opacity="0.85"/>
  </g>

  <!-- Botanical Berries in Gold -->
  <circle cx="70" cy="225" r="3" fill="url(#goldGrad)" />
  <circle cx="62" cy="180" r="3" fill="url(#goldGrad)" />
  <circle cx="78" cy="138" r="3" fill="url(#goldGrad)" />
  <circle cx="106" cy="98" r="3" fill="url(#goldGrad)" />
  <circle cx="148" cy="65" r="3" fill="url(#goldGrad)" />

  <circle cx="330" cy="225" r="3" fill="url(#goldGrad)" />
  <circle cx="338" cy="180" r="3" fill="url(#goldGrad)" />
  <circle cx="322" cy="138" r="3" fill="url(#goldGrad)" />
  <circle cx="294" cy="98" r="3" fill="url(#goldGrad)" />
  <circle cx="252" cy="65" r="3" fill="url(#goldGrad)" />

  <!-- Bottom Ribbons & Knot in Gold -->
  <path d="M 180 300 Q 200 290 220 300 Q 200 315 180 300 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 185 305 Q 170 340 150 365" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 215 305 Q 230 340 250 365" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Monogram Initials -->
  <text x="200" y="215" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="70" font-weight="600" font-style="italic" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    A&amp;I
  </text>
  <text x="200" y="245" font-family="'Cinzel', 'Outfit', sans-serif" font-size="11" font-weight="500" fill="#8CA68C" text-anchor="middle" letter-spacing="8">
    20 . 12 . 2026
  </text>
</svg>
